[package]
name = "voxshift"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Local real-time voice changer and soundboard (VB-CABLE virtual mic)"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "links"] }
egui = "0.36.2"
# Icon font (Phosphor, regular weight): about 0.5 MB in the exe.
egui-phosphor = "0.14.0"
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
rfd = "0.17.2"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "flac", "pcm", "adpcm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Security"] }

# Linux: winit needs a windowing backend (default features are off above).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }

# Only for the UI snapshot tests (they write PNGs to look at); already in the dependency tree.
[dev-dependencies]
png = "0.18"

# The DSP runs in real time, so even debug builds need optimised code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
